name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_lmRUn3mWMp0n48c6H63XidpZ
      VERCEL_PROJECT_ID: prj_EzcKmcwkrYVbiAy9xlUztngUtEo4
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "22.19.0"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 환경 변수는 Vercel 프로젝트 설정에서 받아온다 (VITE_API_URL, VITE_SENTRY_DSN 등)
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --scope=shackstacks-projects --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --scope=shackstacks-projects --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --scope=shackstacks-projects --token="$VERCEL_TOKEN"

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다."
            exit 0
          fi
          jq -n \
            --arg title "🚀 프로덕션 배포 완료" \
            --arg desc "$(echo "$COMMIT_MESSAGE" | head -1)" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 5763719,
                fields: [
                  { name: "브랜치", value: $branch, inline: true },
                  { name: "배포자", value: $actor, inline: true },
                  { name: "링크", value: ("[사이트](https://mamma-mia.site) · [배포 로그](" + $run_url + ")") }
                ]
              }]
            }' | curl -sS -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
